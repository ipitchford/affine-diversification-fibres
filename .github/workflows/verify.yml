name: Verify historical and Route A candidates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-release-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable 0.2.1 candidate
        uses: actions/checkout@v4
        with:
          ref: v0.2.1-candidate

      - name: Build the pinned historical replay image
        run: docker build -f Containerfile -t affine-diversification-fibres:historical .

      - name: Run historical package and scratch replay checks
        run: docker run --rm affine-diversification-fibres:historical

  route-a-successor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Route A successor
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the frozen analysis environment
        run: python -m pip install -r requirements-lock.txt

      - name: Verify the Route A package and sealed ledger
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/affine-mpl-cache
          PYTHONPATH: .
        run: python verification/verify_route_a_candidate.py

      - name: Run all tests with Python optimizations enabled
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/affine-mpl-cache-opt
          PYTHONPATH: .
        run: python -O -m unittest affine_diversification.test_affine_fibre -v

  route-a-container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Route A successor
        uses: actions/checkout@v4

      - name: Build the pinned Route A image
        run: docker build -f Containerfile -t affine-diversification-fibres:route-a .

      - name: Run the Route A verifier in the image
        run: docker run --rm affine-diversification-fibres:route-a
